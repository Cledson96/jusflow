name: Publish Images

on:
  push:
    branches:
      - main
      - development

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: cledson96/jurisflow-api
  WEB_IMAGE_NAME: cledson96/jurisflow-web

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare metadata
        id: meta
        shell: bash
        run: |
          api_tags="${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:sha-${GITHUB_SHA}"
          web_tags="${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:sha-${GITHUB_SHA}"
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            api_tags="${api_tags}"$'\n'"${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:main"$'\n'"${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:latest"
            web_tags="${web_tags}"$'\n'"${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:main"$'\n'"${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:latest"
          else
            api_tags="${api_tags}"$'\n'"${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:development"
            web_tags="${web_tags}"$'\n'"${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:development"
          fi
          {
            echo "api_tags<<EOF"
            echo "${api_tags}"
            echo "EOF"
            echo "web_tags<<EOF"
            echo "${web_tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.api_tags }}

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.seudominio.com
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_DEV_ORGANIZATION_ID=org_demo_jurisflow
          tags: ${{ steps.meta.outputs.web_tags }}
