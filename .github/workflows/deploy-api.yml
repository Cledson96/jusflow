name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - ".github/workflows/deploy-api.yml"
      - "packages/shared/**"
      - "apps/api/Dockerfile"
      - "docker-compose.yml"
      - "scripts/deploy.sh"
      - "scripts/backup-postgres.sh"

concurrency:
  group: production-api
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/cledson96/jurisflow-api

jobs:
  deploy:
    name: Build, publish, and deploy api
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @jurisflow/api prisma:generate

      - name: Build API
        run: pnpm --filter @jurisflow/api build

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy API on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: DEPLOY_BRANCH,DEPLOY_TARGET,API_IMAGE_TAG,APP_ENV_FILE,VPS_APP_DIR
          script: |
            export DEPLOY_BRANCH="main"
            export DEPLOY_TARGET="api"
            export API_IMAGE_TAG="sha-${{ github.sha }}"
            export APP_ENV_FILE=".env.production"
            cd "$VPS_APP_DIR"
            bash ./scripts/deploy.sh
            curl --fail --silent https://api.jurisflow.cledson.com.br/docs >/dev/null
