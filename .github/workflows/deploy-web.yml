name: Deploy Web

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "apps/web/Dockerfile"
      - "docker-compose.yml"
      - "infra/nginx/**"
      - "scripts/deploy.sh"

concurrency:
  group: production-web
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/cledson96/jurisflow-web

jobs:
  deploy:
    name: Build, publish, and deploy web
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        env:
          NEXT_PUBLIC_API_URL: https://api.seudominio.com
          NEXT_PUBLIC_AUTH_MODE: authjs
          NEXT_PUBLIC_DEV_ORGANIZATION_ID: org_demo_jurisflow
        run: pnpm --filter @jurisflow/web build

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.seudominio.com
            NEXT_PUBLIC_AUTH_MODE=authjs
            NEXT_PUBLIC_DEV_ORGANIZATION_ID=org_demo_jurisflow
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy web on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: DEPLOY_BRANCH,DEPLOY_TARGET,WEB_IMAGE_TAG,APP_ENV_FILE
          script: |
            export DEPLOY_BRANCH="main"
            export DEPLOY_TARGET="web"
            export WEB_IMAGE_TAG="sha-${{ github.sha }}"
            export APP_ENV_FILE=".env.production"
            cd "${{ secrets.VPS_APP_DIR }}"
            bash ./scripts/deploy.sh
