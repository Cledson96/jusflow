services:
  api:
    image: ${API_IMAGE}:${API_IMAGE_TAG}
    container_name: jurisflow-api
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    pull_policy: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:4002:4000"

  web:
    image: ${WEB_IMAGE}:${WEB_IMAGE_TAG}
    container_name: jurisflow-web
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    depends_on:
      api:
        condition: service_started
    pull_policy: always
    ports:
      - "127.0.0.1:3002:3000"
