services:
  api:
    image: ${API_IMAGE}:${API_IMAGE_TAG}
    container_name: jurisflow-api
    restart: unless-stopped
    env_file:
      - .env
    pull_policy: always
    expose:
      - "4000"

  web:
    image: ${WEB_IMAGE}:${WEB_IMAGE_TAG}
    container_name: jurisflow-web
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      api:
        condition: service_started
    pull_policy: always
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: jurisflow-nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
